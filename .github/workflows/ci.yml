name: CI

# Triggers (cost control, see docs/blueprint/maintenance-policy.md, "CI"): pull requests that are not
# drafts, a weekly run and a manual run. There is no run on push to main: the PR was green on its
# head before it was merged (AGENTS.md section 10.3). The weekly run and `workflow_dispatch` on main
# also warm the Go module and build caches that every pull request can read (a cache saved on a PR
# ref is visible to that PR only; one saved on the default branch is visible to all).
# `converted_to_draft` starts a run so that a run in progress on the pull request is cancelled by the
# concurrency group below when the pull request is turned back into a draft (that run skips every
# job and `ci-result` fails, see the end of this file).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The Go toolchain is installed by .github/ci/install-go.sh from the `toolchain` line of go.mod
  # (no setup action) and GOTOOLCHAIN=local keeps every `go` command on it. The CI tools below are
  # not module dependencies: they are installed with `go install` at these pinned versions.
  STATICCHECK_VERSION: v0.8.2
  GOVULNCHECK_VERSION: v1.9.0

jobs:
  # Which parts of the repository changed (C-4). Draft pull requests run nothing: the first job is
  # skipped and every job that needs it is skipped with it. A skipped job counts as a success for a
  # required status check, which is why `ci-result` refuses a draft by itself (G8). (The owner's
  # branch ruleset on main requires only the job `ci-result`, once the owner enables it; see the end
  # of this file.) The classification is .github/ci/classify-paths.py, unit-tested below. `schedule`
  # and `workflow_dispatch` do not diff: everything runs.
  changes:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.classify.outputs.go }}
      desk: ${{ steps.classify.outputs.desk }}
      e2e: ${{ steps.classify.outputs.e2e }}
      docker: ${{ steps.classify.outputs.docker }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      all: ${{ steps.classify.outputs.all }}
    steps:
      # Full history, so that the merge base of the pull request exists.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test the classifier
        run: python3 .github/ci/test_classify_paths.py
      # `base...head` diffs against the merge base, so commits that main gained later are not
      # counted. --no-renames lists both the old and the new path of a rename.
      - name: Classify the changed paths
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/changed.txt"
          if [ "$EVENT" = pull_request ]; then
            git -c core.quotepath=false diff --name-only --no-renames "$BASE...$HEAD" > "$RUNNER_TEMP/changed.txt"
            cat "$RUNNER_TEMP/changed.txt"
          fi
          python3 .github/ci/classify-paths.py --event "$EVENT" < "$RUNNER_TEMP/changed.txt" > "$RUNNER_TEMP/outputs.txt"
          # Fail closed: an empty or malformed result must fail the job, not skip every check.
          cat "$RUNNER_TEMP/outputs.txt"
          [ "$(cut -d= -f1 "$RUNNER_TEMP/outputs.txt" | paste -sd,)" = "go,desk,e2e,docker,docs_only,all" ]
          [ "$(grep -cE '^[a-z0-9_]+=(true|false)$' "$RUNNER_TEMP/outputs.txt")" = 6 ]
          cat "$RUNNER_TEMP/outputs.txt" >> "$GITHUB_OUTPUT"

  # Offline check of the relative links and anchors in the Markdown files (about 10 seconds).
  docs:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 .github/ci/linkcheck.py

  check:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.go == 'true'
    # Pinned to 24.04, not ubuntu-latest: the PostgreSQL client tools that later phases need
    # (pg_dump, pg_restore) must match the postgres:16 service, and 24.04 ships
    # postgresql-client-16 in its own archive (26.04 does not). Re-evaluate when the PostgreSQL
    # floor or the service version changes, or when 24.04 runners are retired.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The integration tests (from P1) need PostgreSQL: they create and drop fb_test_* databases and
    # fail clearly when FORGEBASE_TEST_DATABASE_URL is not set; they are never skipped.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: forgebase
          POSTGRES_PASSWORD: forgebase
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forgebase"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FORGEBASE_TEST_DATABASE_URL: postgres://forgebase:forgebase@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Go toolchain
        run: .github/ci/install-go.sh
      # Module downloads and the build cache (the CI tools are installed with `go install` on every
      # run, so they are not cached). The key follows go.mod, go.sum and the tool versions;
      # restore-keys gives a partial hit after a change of any of them.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-check-${{ env.STATICCHECK_VERSION }}-${{ env.GOVULNCHECK_VERSION }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            ${{ runner.os }}-check-${{ env.STATICCHECK_VERSION }}-${{ env.GOVULNCHECK_VERSION }}-
            ${{ runner.os }}-check-
      - name: Install staticcheck and govulncheck (pinned)
        run: |
          set -eu
          go install "honnef.co/go/tools/cmd/staticcheck@$STATICCHECK_VERSION"
          go install "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      # The backup tests run the real pg_dump and pg_restore, whose major version must equal the server's (16): a
      # newer pg_dump writes an archive that the server's pg_restore may not read, and a newer pg_restore sends SQL
      # that an older server rejects (newer runner images ship 18). postgresql-client-16 installs to
      # /usr/lib/postgresql/16/bin next to other versions (the Ubuntu 24.04 archive has it; a no-op when it is
      # installed already). FORGEBASE_PG_BIN points there for the rest of the job. The step prints the versions and
      # fails if either is not 16.
      - name: PostgreSQL 16 client tools
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          bin=/usr/lib/postgresql/16/bin
          for tool in pg_dump pg_restore; do
            version="$("$bin/$tool" --version)"
            echo "$version"
            case "$version" in
              "$tool (PostgreSQL) 16."*) ;;
              *) echo "$tool is not version 16" >&2; exit 1 ;;
            esac
          done
          echo "FORGEBASE_PG_BIN=$bin" >> "$GITHUB_ENV"
      # TLS to PostgreSQL (ADR 0018): a second PostgreSQL 16 on port 5433 with ssl=on and a throwaway CA, started by
      # the same script that runs locally. It appends FORGEBASE_TEST_TLS_URL, FORGEBASE_TEST_TLS_CA and
      # FORGEBASE_TEST_TLS_WRONG_CA to GITHUB_ENV, so the TLS tests run in the `go test` below. They fail (never
      # skip) when CI is true and these variables are missing. Docker and openssl are on the runner.
      - name: PostgreSQL 16 with TLS
        run: .github/ci/pg-tls.sh up "$RUNNER_TEMP/pg-tls"
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted (run gofmt -w):" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      # ./... skips directories that start with a dot, so the licence checker under .github/ is
      # named explicitly.
      - run: go vet ./... ./.github/ci/licensecheck
      - run: staticcheck ./... ./.github/ci/licensecheck
      - run: govulncheck ./...
      - run: go test -race ./...
      - run: go build ./...
      # No cgo (maintenance policy, toolchain): the build must also work with CGO_ENABLED=0.
      - run: CGO_ENABLED=0 go build ./...
      - run: go mod verify
      # Fails when go.mod or go.sum is not tidy.
      - run: go mod tidy -diff
      # The example apps are modules of their own (examples/*/go.mod, a `replace` to this checkout): each imports
      # only the public API, which the compiler enforces (everything else is under internal/), and has its own
      # checks. They use the PostgreSQL service above. `./...` at the root does not enter them.
      - name: Example modules
        run: |
          set -eu
          for dir in examples/*/; do
            [ -f "${dir}go.mod" ] || continue
            echo "== $dir"
            (
              cd "$dir"
              go vet ./...
              staticcheck ./...
              govulncheck ./...
              go test -race ./...
              go build ./...
              CGO_ENABLED=0 go build ./...
              go mod verify
              go mod tidy -diff
            )
          done

  # Every third-party module in the build graph must have an allowed licence (MIT, Apache-2.0,
  # BSD-2-Clause, BSD-3-Clause, ISC). The checker is .github/ci/licensecheck, standard library only.
  licenses:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Go toolchain
        run: .github/ci/install-go.sh
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-licenses-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: ${{ runner.os }}-licenses-
      - name: Test the licence checker
        run: go test ./.github/ci/licensecheck
      # The module directories must exist for the checker to read their licence files.
      - run: go mod download
      - name: Check the licences
        run: go run ./.github/ci/licensecheck

  # The generated app (P4): `forgebase new-app` writes a module outside the checkout; it is checked as created
  # (gofmt, vet, tests, build, tidy), then it migrates, serves, logs a user in and reports the sample DocType in the
  # metadata API as owned by the app. The generated module requires this checkout with a `replace` to its absolute
  # path, and its go.sum is the checkout's. The password below is for a throwaway user of the service container.
  app-template:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: forgebase
          POSTGRES_PASSWORD: forgebase
          POSTGRES_DB: demo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forgebase"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The tests create and drop their own databases; the app itself uses the database `demo`.
      FORGEBASE_TEST_DATABASE_URL: postgres://forgebase:forgebase@localhost:5432/postgres
      FORGEBASE_DATABASE_URL: postgres://forgebase:forgebase@localhost:5432/demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Go toolchain
        run: .github/ci/install-go.sh
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-app-template-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: ${{ runner.os }}-app-template-
      - run: go build -o bin/forgebase ./cmd/forgebase
      - name: Generate the app
        run: bin/forgebase new-app demo --forgebase-path "$GITHUB_WORKSPACE" --dir "$RUNNER_TEMP"
      - name: Check the generated app
        working-directory: ${{ runner.temp }}/demo
        run: |
          set -eu
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The generated files are not gofmt-formatted:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
          go vet ./...
          go mod tidy -diff
      - name: Test the generated app
        working-directory: ${{ runner.temp }}/demo
        run: go test ./...
      - name: Build the generated app
        working-directory: ${{ runner.temp }}/demo
        run: go build -o demo ./cmd/demo
      - name: Migrate, serve, log in and read the metadata
        working-directory: ${{ runner.temp }}/demo
        run: |
          set -eu
          ./demo migrate
          echo 'a long password' | ./demo user create ann --role "Demo User"
          FORGEBASE_DEV_INSECURE_COOKIES=1 ./demo serve > server.log 2>&1 &
          server=$!
          # Any answer, whatever its status, means the server is up.
          for _ in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:8000/api/v1/meta; then break; fi
            sleep 1
          done
          curl -fsS -c jar -H 'Content-Type: application/json' \
            -d '{"username":"ann","password":"a long password"}' http://127.0.0.1:8000/api/v1/login
          curl -fsS -b jar http://127.0.0.1:8000/api/v1/meta/demo_note | tee meta.json
          grep -q '"app":"demo"' meta.json
          kill "$server"
      - name: Show the server log
        if: failure()
        run: cat "$RUNNER_TEMP/demo/server.log"

  # Two sites on one server and a backup restored into a new database (M7.3, ADR 0014): the composed binary of
  # examples/sales_extension with examples/sites/forgebase.toml. The script examples/sites/ci.sh does the work and
  # can be run locally. It needs the client tools (pg_dump, pg_restore, version 16, the server's) like the `check`
  # job, and curl and jq (on the runner image). The URLs are built from the service container's throwaway
  # credentials; the script never prints them. The databases are created by the script (`site create`). The
  # parts of the Rust script that need webhooks, custom fields and user permissions (P7) are added by that phase.
  sites:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.go == 'true'
    # Pinned to 24.04, not ubuntu-latest: the client tools must match the postgres:16 service, and 24.04 ships
    # postgresql-client-16 in its own archive (26.04 does not). Re-evaluate when the PostgreSQL floor or the
    # service version changes, or when 24.04 runners are retired.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: forgebase
          POSTGRES_PASSWORD: forgebase
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forgebase"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SHOP_DATABASE_URL: postgres://forgebase:forgebase@localhost:5432/sites_shop
      FIELD_DATABASE_URL: postgres://forgebase:forgebase@localhost:5432/sites_field
      RESTORE_DATABASE_URL: postgres://forgebase:forgebase@localhost:5432/sites_restore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Go toolchain
        run: .github/ci/install-go.sh
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-sites-${{ hashFiles('go.mod', 'go.sum', 'examples/*/go.mod', 'examples/*/go.sum') }}
          restore-keys: ${{ runner.os }}-sites-
      # Same step as in the `check` job (see the comment there).
      - name: PostgreSQL 16 client tools
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          bin=/usr/lib/postgresql/16/bin
          for tool in pg_dump pg_restore; do
            version="$("$bin/$tool" --version)"
            echo "$version"
            case "$version" in
              "$tool (PostgreSQL) 16."*) ;;
              *) echo "$tool is not version 16" >&2; exit 1 ;;
            esac
          done
          echo "FORGEBASE_PG_BIN=$bin" >> "$GITHUB_ENV"
      - name: Build the composed binary
        run: cd examples/sales_extension && go build -o ../../bin/sales_extension ./cmd/sales_extension
      - name: Two sites, a backup and a restore
        run: examples/sites/ci.sh

  # The desk (the React app of desk/, copied unchanged from the Rust repository except for the path of the
  # icon list in desk/src/icons.test.ts, which is internal/core/doctype_icons.txt here): lint, typecheck,
  # unit tests, build, licences and audit.
  desk:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.desk == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The npm download cache (not node_modules), keyed on the lockfile.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('desk/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-
      - name: Check the Node version
        run: node -e 'const [a, b] = process.versions.node.split(".").map(Number); if (!((a === 20 && b >= 19) || (a === 22 && b >= 12) || a > 22)) { console.error("Node ^20.19.0 or >=22.12.0 is required (Vite 8), found " + process.version); process.exit(1); }'
      # desk/.npmrc sets ignore-scripts=true: no dependency install script runs in CI.
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run licenses
      - run: npm audit --audit-level=high

  # The desk end-to-end tests (Playwright in Chromium) against a real `forgebase serve` with the built desk:
  # login, list, create, edit and submit a sales order, and a user without the submit right, the smaller
  # tests of the command bar, the recent documents, the filter chip with the Link title and
  # prefers-reduced-motion, and (P6) the workflow, the saved views, the summary and the report. The binary is
  # examples/e2e_app (the stock command plus the app that defines the report, the Go equivalent of the Rust
  # example e2e_app). Seeding: .github/ci/e2e-seed.sh (a temporary, phase-scoped copy of desk/e2e/seed.sh, see
  # its header). Only the tests whose routes exist run: E2E_GREP below names them, and
  # the phase that ports the routes of a group of tests adds that group (CHANGELOG, "P3.2"). No artifact
  # upload (no pinned action for it is in use); on failure the server log is printed. The database URL is
  # built from the service container's credentials and never printed.
  e2e:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: forgebase
          POSTGRES_PASSWORD: forgebase
          POSTGRES_DB: forgebase_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forgebase"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The service's own database, empty and used by this job only.
      FORGEBASE_DATABASE_URL: postgres://forgebase:forgebase@localhost:5432/forgebase_e2e
      E2E_BASE_URL: http://127.0.0.1:8000
      # The tests that run (a regular expression on the test titles, over desk/e2e/smoke.spec.ts and
      # desk/e2e/restrict.spec.ts). P3: login, list, create, edit and submit; the command bar; the recent
      # documents; the filter chip with the Link title; prefers-reduced-motion; the Columns menu; the keyboard
      # focus (UX.5); and the two tests of the level 1 field (credit_limit) that need only the field levels.
      # P6: the workflow (a clerk sends a purchase request, the stale version), the saved views (private,
      # shared, a stale one), the summary and the report. The others need routes of P7: export and import
      # (desk/e2e/transfer.spec.ts); the user permissions and the custom field (the rest of
      # desk/e2e/restrict.spec.ts). The phase that ports those routes adds the titles (CHANGELOG, "P3.2"); in
      # P7 the pattern and the seed go.
      E2E_GREP: "login, list, create, edit and submit|command bar opens|recent documents of one user|clerk without create rights|filter shows as a chip|prefers-reduced-motion|Columns menu hides a column|focus indicator check reads|keyboard focus is visible|Sales Manager sees credit_limit|reads level 1 but not writes it|clerk sends a purchase request|workflow action on a stale version|private view survives|administrator shares a view|view that names a field|Summary panel counts|manager runs a report, sorts it"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Go toolchain
        run: .github/ci/install-go.sh
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-e2e-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: ${{ runner.os }}-e2e-
      # The stock command plus the app that defines the report (examples/e2e_app, P6): a report can only come
      # from an app compiled into the binary.
      - run: go build -o bin/e2e_app ./examples/e2e_app
      # The npm download cache (not node_modules), keyed on the lockfile.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('desk/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-
      - name: Check the Node version
        run: node -e 'const [a, b] = process.versions.node.split(".").map(Number); if (!((a === 20 && b >= 19) || (a === 22 && b >= 12) || a > 22)) { console.error("Node ^20.19.0 or >=22.12.0 is required (Vite 8), found " + process.version); process.exit(1); }'
      # desk/.npmrc sets ignore-scripts=true: no dependency install script runs in CI.
      - name: Build the desk
        working-directory: desk
        run: |
          npm ci
          npm run build
      # Downloads the Chromium that this exact Playwright version drives (and its system libraries).
      - name: Install Chromium
        working-directory: desk
        run: npx playwright install --with-deps chromium
      - name: Seed the database
        run: .github/ci/e2e-seed.sh
      - name: Start the server
        run: |
          FORGEBASE_DESK_DIR=desk/dist \
          FORGEBASE_DEV_INSECURE_COOKIES=1 \
          FORGEBASE_ALLOWED_HOSTS=localhost,127.0.0.1 \
          bin/e2e_app serve --doctypes bin/e2e/doctypes > server.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8000/desk/; then exit 0; fi
            sleep 1
          done
          echo "the server did not answer in 30 seconds" >&2
          cat server.log >&2
          exit 1
      - name: Run the end-to-end tests
        working-directory: desk
        run: npx playwright test e2e/smoke.spec.ts e2e/restrict.spec.ts --grep "$E2E_GREP"
      - name: Show the server log
        if: failure()
        run: tail -n 100 server.log

  # The container image (P5.3, D1 and D2): builds the Dockerfile without pushing it anywhere and runs it
  # once in single-container mode against a PostgreSQL service. Runs only when the Dockerfile,
  # .dockerignore, deploy/ or .github/ change, and on the weekly and manual runs (which also catch a
  # change in the Go code or the desk that breaks the build). Docker is preinstalled on the runner.
  docker:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: forgebase
          POSTGRES_PASSWORD: forgebase
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forgebase"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the entrypoint (fake binary)
        run: bash deploy/test-entrypoint.sh
      - name: Build the image (no push)
        run: docker build -t forgebase-sales .
      # The trust store of the image (ADR 0018): the CA bundle is there, SSL_CERT_FILE points at it so
      # that only the bundle is read, and the base image's public "snakeoil" test certificate and key
      # are gone (it must never be a trusted root), and /etc/ssl/certs holds nothing else (libpq also
      # reads its hashed files, which SSL_CERT_FILE does not limit). Run as root: /etc/ssl/private is
      # not readable by the application user. `sh -e`: every line must hold, not only the last one.
      - name: Trust store of the image
        run: |
          docker run --rm --user 0 --entrypoint sh forgebase-sales -ec '
            test "$SSL_CERT_FILE" = /etc/ssl/certs/ca-certificates.crt
            test -s "$SSL_CERT_FILE"
            test ! -e /etc/ssl/certs/ssl-cert-snakeoil.pem
            test ! -e /etc/ssl/private/ssl-cert-snakeoil.key
            test "$(ls -A /etc/ssl/certs)" = ca-certificates.crt
          '
      # `all` mode on the host network (to reach the service on localhost): migrate on start, the
      # desk and the login page, a login and an authenticated API call, then a graceful stop (the exit
      # code must be 0, which needs both the server and the worker to stop on SIGTERM).
      - name: Smoke test, single-container mode
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name fb --network host \
            -e FORGEBASE_DATABASE_URL=postgres://forgebase:forgebase@localhost:5432/postgres \
            -e FORGEBASE_MIGRATE_ON_START=1 \
            -e FORGEBASE_ALLOWED_HOSTS=localhost \
            -e FORGEBASE_DEV_INSECURE_COOKIES=1 \
            forgebase-sales all
          for _ in $(seq 1 60); do
            curl -fsS -o /dev/null http://localhost:8000/desk/ && break
            sleep 1
          done
          printf '%s\n' 'ci-smoke-password' | docker exec -i fb forgebase-app user create admin --role Administrator
          curl -fsS http://localhost:8000/desk/ | grep -q '<title>Forgebase Desk'
          curl -fsS -c "$RUNNER_TEMP/jar" -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"ci-smoke-password"}' http://localhost:8000/api/v1/login > /dev/null
          curl -fsS -b "$RUNNER_TEMP/jar" http://localhost:8000/api/v1/meta > /dev/null
          docker logs fb 2>&1 | grep -q '^worker: started'
          docker stop fb
          test "$(docker inspect fb --format '{{.State.ExitCode}}')" = 0
      - name: Container logs
        if: failure()
        run: docker logs fb || true

  # The single required status check of the branch ruleset on main (owner decision of 2026-10-31,
  # docs/blueprint/maintenance-policy.md, "CI"). It runs always, also when a job failed or was
  # cancelled, and fails unless every job it needs finished with `success` or `skipped` (a skipped
  # job is how path filtering leaves jobs out). Any other result, including one this script does
  # not know, fails.
  #
  # G8 (Go port, ADR 0026): on a draft pull request this job FAILS, with a clear message. On a draft
  # every other job is skipped, which a required check would count as a pass; failing here means
  # that a draft run can never satisfy the required check. CI runs again, and `ci-result` passes
  # or fails on its merits, when the pull request is marked ready for review; merging needs the
  # `ci-result` of the run on the READY pull request head (AGENTS.md section 10.3).
  #
  # Later phases add jobs. Every new job must be added to `needs`
  # here, or the ruleset does not guard it.
  ci-result:
    if: always()
    needs: [changes, docs, check, licenses, sites, app-template, desk, e2e, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Refuse a draft pull request
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          if [ "$EVENT" = pull_request ] && [ "$DRAFT" = true ]; then
            echo "::error::ci-result: this pull request is a draft; CI does not run on drafts. Mark it ready for review to run CI. A draft run never satisfies the required check."
            exit 1
          fi
      - name: Fail if any job failed or was cancelled
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          if not needs:
              sys.exit("no job result to check")
          bad = {name: job.get("result") for name, job in needs.items() if job.get("result") not in ("success", "skipped")}
          for name, job in sorted(needs.items()):
              print(f"{name}: {job.get('result')}")
          if bad:
              sys.exit(f"failed, cancelled or unknown: {bad}")
          PY
